name: CodeSentinel AI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]

jobs:
  codesentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run CodeSentinel AI
        uses: kushmunjal/codesentinel-ai@main
        with:
          provider: 'openai'
          model: 'gpt-4o'
          api_key: ${{ secrets.LLM_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
